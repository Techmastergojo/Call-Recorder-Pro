name: Build RecordPro APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # Manual trigger from GitHub UI

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up JDK 17 ─────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Set up Gradle 8.9 (no wrapper JAR needed) ─────────────────────
      #    gradle/actions/setup-gradle installs Gradle directly when
      #    gradle-version is specified — bypasses the wrapper JAR entirely.
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
          cache-read-only: false

      # ── 4. Set up Android SDK ─────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # ── 5. Build the APK using 'gradle' directly (no ./gradlew needed) ───
      - name: Build Debug APK
        run: gradle assembleDebug --project-dir . --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 6. Rename & upload APK ────────────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/RecordPro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecordPro-APK
          path: output/RecordPro.apk
          retention-days: 30

      - name: Build summary
        run: |
          echo "✅ RecordPro APK built successfully!"
          ls -lh output/RecordPro.apk
          echo ""
          echo "📱 To install on Samsung A32:"
          echo "   1. Download RecordPro-APK from Artifacts above"
          echo "   2. Transfer to phone via USB or WhatsApp"
          echo "   3. Install via file manager (allow unknown sources)"
